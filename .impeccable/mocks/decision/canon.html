<!doctype html>
<html lang="es-VE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Estándar de la categoría — perfil del lugar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root { --white: #FFFFFF; --ink: #111827; --ink-2: #6B7280; --orange: #FF6B2C; --line: #E5E7EB; --chip: #F3F4F6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; background: var(--white); color: var(--ink); }
  .photo { height: 280px; background: #B35F2B; position: relative; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 13px; color: #fff; font-weight: 600; }
  .circle { position: absolute; top: 52px; width: 40px; height: 40px; border-radius: 20px; background: #fff; display: grid; place-items: center; }
  .circle svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; }
  .dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.6); }
  .dots i:first-child { background: #fff; }
  .body { padding: 16px; }
  h1 { font-size: 26px; font-weight: 700; }
  .stars { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; color: var(--ink-2); }
  .stars b { color: var(--orange); font-size: 16px; letter-spacing: 1px; }
  .chips { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chip { background: var(--chip); border-radius: 16px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
  .tabs { display: flex; gap: 24px; margin-top: 16px; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .tabs span { padding-bottom: 10px; }
  .tabs .on { color: var(--ink); border-bottom: 2px solid var(--orange); }
  .info { margin-top: 8px; }
  .row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .row svg { width: 20px; height: 20px; stroke: var(--ink-2); fill: none; stroke-width: 2; flex: none; }
  .bar { position: absolute; left: 0; right: 0; top: 760px; height: 84px; padding: 12px 16px 24px; border-top: 1px solid var(--line); background: #fff; }
  .btn { height: 48px; border-radius: 24px; background: var(--orange); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 16px; }
</style>
</head>
<body>
  <div class="photo">
    <div class="status"><span>9:41</span><span>4G · 62%</span></div>
    <div class="circle" style="left:16px" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="circle" style="right:16px" aria-label="Guardar"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></div>
    <div class="dots"><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="body">
    <h1>Smash Club</h1>
    <div class="stars"><b>★★★★½</b> 4,3 (47) · $$ · Hamburguesas</div>
    <div class="chips"><span class="chip">Las Mercedes</span><span class="chip">Abierto</span><span class="chip">Delivery</span><span class="chip">Pago Móvil</span></div>
    <div class="tabs"><span class="on">Resumen</span><span>Menú</span><span>Reseñas</span><span>Fotos</span></div>
    <div class="info">
      <div class="row"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Abierto · cierra 11:00 p. m.</div>
      <div class="row"><svg viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/></svg>Calle Madrid, Las Mercedes</div>
      <div class="row"><svg viewBox="0 0 24 24"><path d="M3 7h18v10H3z"/></svg>$12 – $18 por persona</div>
    </div>
  </div>
  <nav class="bar"><div class="btn">Escribir por WhatsApp</div></nav>
</body>
</html>
